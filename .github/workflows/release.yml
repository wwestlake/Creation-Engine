name: Build and Release

on:
  push:
    tags:
      - "creation-engine-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CreationEngine

    steps:
      # Engine's own CMake resolves every shared/ path (VFS, AssetSystem,
      # Services, UI) as ../../shared relative to itself -- its real layout
      # as an apps/CreationEngine submodule inside the Creation-Suite
      # umbrella repo. Rather than overriding each of those relative paths
      # individually (fragile -- Engine's add_subdirectory calls are
      # hardcoded relative paths, not CACHE-variable-driven like the other
      # apps, so a variable override would have been a silent no-op here),
      # CI just reproduces the real nesting: check out the umbrella first
      # for its shared/ tree, then check out this app's own tagged commit
      # into apps/CreationEngine, overwriting the umbrella's empty
      # submodule placeholder. Every relative path then resolves exactly
      # as it does in a real Creation-Suite checkout.
      - name: Checkout Creation Suite umbrella (for shared/)
        uses: actions/checkout@v4
        with:
          repository: wwestlake/Creation-Suite
          ref: claude/development

      - name: Checkout this app at the release tag
        uses: actions/checkout@v4
        with:
          path: apps/CreationEngine
          # third_party/entt is a submodule of THIS repo -- without this
          # it's an empty directory in CI and the CMakeLists.txt EXISTS
          # check for it fails, falling through to its FATAL_ERROR branch.
          submodules: true

      - name: Fetch JUCE
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.7 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP\JUCE"

      - name: Install LLVM via vcpkg (S3-backed binary cache)
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          # x-aws binary caching keyed on the exact port+triplet+compiler
          # hash -- shared across every app's pipeline and local dev
          # machines that point at this same bucket, not just this repo.
          # First build populates the cache (~45-90 min for LLVM from
          # source); every later build, in any of the 6 apps, downloads
          # it in a couple minutes instead of rebuilding.
          VCPKG_BINARY_SOURCES: "clear;x-aws,s3://creation-suite-build-cache/vcpkg-cache/,readwrite"
        run: |
          $vcpkgExe = if ($env:VCPKG_ROOT) { Join-Path $env:VCPKG_ROOT "vcpkg.exe" } else { "C:\vcpkg\vcpkg.exe" }
          & $vcpkgExe install --triplet x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed."
          }

      - name: Classify release
        id: classify
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          if ($tag -notmatch '^creation-engine-v(?<version>\d+\.\d+\.\d+)(?:-(?<channel>[0-9A-Za-z.-]+))?$') {
            throw "Tag '$tag' must start with creation-engine-v."
          }

          $versionText = $Matches.version
          $explicitChannel = $Matches.channel
          $channel = "stable"
          $prerelease = "false"

          if ($explicitChannel) {
            $channel = $explicitChannel
            $prerelease = "true"
          }
          else {
            $parts = $versionText.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]

            if ($major -eq 0 -and $minor -lt 5) {
              $channel = "alpha"
              $prerelease = "true"
            }
            elseif ($major -eq 0 -and $minor -ge 5) {
              $channel = "beta"
              $prerelease = "true"
            }
          }

          $suffix = ""
          if ($channel -ne "stable") {
            $suffix = " ($channel)"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$versionText"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$channel"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "suffix=$suffix"

      - name: Configure CMake
        shell: pwsh
        run: |
          # CE_ENABLE_SCRIPTING defaults to ON. The vcpkg step above just
          # installed LLVM (from the S3 cache after the first run), so
          # scripting stays on for real -- CEL is meant to be in every
          # app, not disabled to dodge an LLVM build.
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$env:RUNNER_TEMP\JUCE" "-DCREATION_ENGINE_VERSION=${{ steps.classify.outputs.version }}"

      - name: Build app
        shell: pwsh
        run: |
          cmake --build build --config Release --target CreationEngineEditor

      - name: Install MSI packaging tools
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installRoot = Join-Path $PWD "artifacts\stage\creation-engine"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null

          cmake --install build --config Release --prefix $installRoot

          $exe = Get-ChildItem $installRoot -Recurse -File | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $exe) {
            throw "Could not find the packaged Creation Engine executable."
          }

          $zipName = Join-Path $PWD ("artifacts\{0}.zip" -f "${{ steps.classify.outputs.tag }}")
          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          Compress-Archive -Path (Join-Path $installRoot "*") -DestinationPath $zipName -Force

      - name: Build MSI installer
        shell: pwsh
        run: |
          $wixBins = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          )

          foreach ($wixBin in $wixBins) {
            if (Test-Path $wixBin) {
              $env:PATH = "$wixBin;$env:PATH"
            }
          }

          $cpack = "${env:ProgramFiles}\CMake\bin\cpack.exe"
          if (-not (Test-Path $cpack)) {
            $cpack = "cpack"
          }

          & $cpack -C Release -G WIX --config build\CPackConfig.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "MSI packaging failed."
          }

          $msi = Get-ChildItem $PWD -Recurse -File -Filter *.msi | Select-Object -First 1
          if (-not $msi) {
            throw "Could not find the packaged Creation Engine MSI."
          }

          $msiName = Join-Path $PWD ("artifacts\{0}.msi" -f "${{ steps.classify.outputs.tag }}")
          if (Test-Path $msiName) {
            Remove-Item $msiName -Force
          }

          Move-Item -Path $msi.FullName -Destination $msiName -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-creation-engine
          path: apps/CreationEngine/artifacts/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Creation Engine ${{ steps.classify.outputs.version }}${{ steps.classify.outputs.suffix }}
          prerelease: ${{ steps.classify.outputs.prerelease }}
          files: apps/CreationEngine/artifacts/*
